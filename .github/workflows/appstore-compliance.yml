name: Appstore Compliance Check

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run compliance validator
        run: ./scripts/validate_appstore.sh

      - name: Fail if issues found
        if: failure()
        run: |
          echo "❌ Appstore compliance check failed!"
          echo "Please ensure all modules have:"
          echo "  - 'support': 'erp23@brainstation-23.com' in __manifest__.py"
          echo "  - Correct email (erp23@brainstation-23.com) in index.html"
          exit 1
